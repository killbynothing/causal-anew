node_id: NODE-013-SNIPER
part: 1
title: 露天咖啡厅街头狙击（暗杀主线开局·认识枢纽）

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# S1 · 定档（tier）
# ★★★ 待我裁决①（详见末注释）
# 两份已有草案存在分歧：
#   节点契约草案(2026-06-15) → canon_highlight
#   SOP §4 样例(2026-06-17)  → canon_beat
# AI建议：canon_beat —— 暴力/动作场面按Policy A默认降beat；结果锁，文本自由
# 若认为"一厘米血洞"等原文细节须逐字呈现以传达本作死亡重量 → 改 canon_highlight
tier: canon_beat  # ★★★ 待我裁决①

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# S2 · 入口（entry_conditions）
# 双条件激活：第一枪开火（E013-02）+ 修哉喊出"是狙击"（E013-03）= 节点正式激活
# E013-01（咖啡厅闲聊）是前序环境帧，不计入入口
# E013-08/10 是节点内部事件，非触发条件
entry_conditions: [E013-02, E013-03]

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# S3 · 锁什么（invariants.canon_locked）
# S4 · 玩家自由度（invariants.player_freedom）
invariants:
  canon_locked:
    # Policy A 判定："换种说法会损失主题或泄底？"
    # E013-02：暴力场面，结果（少妇死亡）是因果基石；细节文本自由 → 结果锁
    # ★★★①连带：若tier升为canon_highlight，此行改为逐字锁（含"一厘米血洞"原文）
    - "result|E013-02: 无辜少妇额头中弹身亡（死亡结果不可更改；呈现细节文本自由）"
    # E013-10：写轮眼暴露 + 狙击手撤退 = 暗杀主线关键结构节点，结果必须锁
    - "result|E013-10: 卡卡西聚焦神威折弯大厦十层枪管，狙击手撤退（卡卡西不死、写轮眼/神威能力本次暴露）"
    # 身份锁：狙击手来源为世界政府本土武装，非郭家政本人（过程文本自由）
    - "identity: 狙击手=世界政府本土武装（非郭家政本人）"

  player_freedom: >
    死局节点（政策B·完整干涉自由）：玩家是在场的普通人，
    合法行动包括——
    帮修哉翻桌/撒面粉扩大粉尘迷雾遮蔽射线（make_cover）；
    拉受惊旁观者（含柳絮等）到墙后减少暴露人头（pull_to_wall）；
    目测或借秋人单反协助指认大厦十层射击窗口（spot_shooter）；
    接手秋人相机拍摄狙击手轮廓留存证据（photo_evidence）；
    红线——不可拥有超能力/写轮眼/神威；
    不可替卡卡西完成折枪管（这是卡卡西的灵魂动作，抢戏=工具化，红线）；
    超出普通人物理上限的行动→张尘式吐槽/现实物理收敛。

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# S5 · 出口（exit_states）
exit_states:
  - id: converged
    desc: >
      原著线（Worldline-0）——
      少妇死亡（E013-02）；卡卡西拉柳絮、独自跑开引杀手（E013-05~06）；
      修哉抛洒面粉造迷雾（E013-07）；三人在墙后会合（E013-08）；
      秋人探出相机拍照、修哉阻止报警（E013-09）；
      卡卡西神威折弯枪管（E013-10）；危机解除、卡卡西搂柳絮安慰后撤离（E013-11）。
      写轮眼/神威能力按原著烈度暴露，暗杀主线正式开局，后续追杀烈度基线建立。
    negates: []

  - id: branched_lowprofile
    branch_gate: BG-SNIPER_COVERT
    desc: >
      玩家 make_cover + spot_shooter 叠加（combine_threshold=2），
      在卡卡西动用神威前即制造有效遮蔽并协助锁定射击窗口，
      狙击手更早失去瞄准机会主动放弃 → 卡卡西少暴露一次完整写轮眼/神威范围。
      δ种子 SNIPER_COVERT_SEED 写入δ账本 → 喂入后续追杀烈度参数（微降）。
      结果大同（狙击手仍撤退），暴露程度有可量化差异。
    negates: []
    # ★★★ 待我裁决②③：此分叉是否成立？combine_threshold 是否合适？见末注释

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# S7 · 收敛手段（必填；剧情内，禁旁白硬拽）
convergence:
  - >
    玩家拉着众人乱跑/脱离掩护 →
    修哉主动喝止并抛洒面粉制造迷雾（E013-07），把人逼回墙后（剧情内施压）
  - >
    玩家试图报警 →
    修哉夺下秋人手机警告"这会被查到的"（E013-09）；
    组织监听威胁浮现，外部压力中断报警链
  - >
    玩家试图冲向狙击手大楼 →
    E013-02/03 造成的街面恐慌人群+无掩护地带构成物理障碍；
    修哉在墙后焦急呼喊（剧情内收敛，NPC主动事件驱动）

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# S6 · 四支柱字段（缺则编译报错）
crossline_comm: false
channel: null              # 无跨线通讯（Ch.13张尘仍在公司，E015-02/03）

coherence:
  lateral_jumper_present: false   # 张尘/尘叔均不在场（横向跳者缺席）
  player_present: true
  phase: null              # 无横向跳者同框，phase 缺省 null

const_refs: []             # 不触及不可回滚常量链（CC.SELF_REF_CHAIN / CC.RYUYA_DEATH 等）

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# S6 · 干涉手段 + SNR代价（四支柱Ⅲ：干涉不免费）
path_set:
  - id: make_cover
    desc: 帮修哉翻桌椅/传递面粉袋，扩大粉尘迷雾遮蔽狙击视线（E013-07 协力）
    type: physical
    snr_cost: low

  - id: pull_to_wall
    desc: 拉受惊旁观者（柳絮等）到墙后，减少暴露人头
    type: physical
    snr_cost: 0              # presence 级，免费（纯在场保护行为）

  - id: spot_shooter
    desc: >
      协助目测+借秋人单反指引大厦十层射击窗口——凡人替代写轮眼的信息干涉；
      与 make_cover 叠加可触发 branched_lowprofile
    type: info
    snr_cost: low

  - id: photo_evidence
    desc: >
      接手秋人单反拍摄狙击手轮廓留证据（E013-09 侧线）；
      社会层面信息积累，独立于收敛主线，不计入 combine_threshold
    type: info
    snr_cost: low

# ★★★ 待我裁决③连带
combine_threshold: 2       # 草案：make_cover + spot_shooter 两手同时达成 → branched_lowprofile

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# δ挂钩
delta_hooks: [SNIPER_COVERT_SEED]
# SNIPER_COVERT_SEED：仅在 branched_lowprofile 激活时写入δ账本
# 语义："卡卡西这次少暴露了一次" → 喂入后续追杀烈度参数（P1-D天台遇袭时可体现差异）

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ★★★ 三个待你裁决的槽
#
# ① 【tier】
#   AI草案：canon_beat
#   理由：少妇之死和折枪管都是暴力/动作场面，按Policy A口诀"换种说法损失主题？"
#         ——描述细节换个说法不会损失核心主题（暗杀主线开局、写轮眼暴露）→ 降beat
#   反面意见（选 canon_highlight 的理由）：
#         本作的"死亡代价观"是核心主题的一部分，
#         "一厘米血洞"这一细节的残酷性正是要让玩家感受到"这个世界真的会死人"
#         → 若你认为此细节须逐字呈现，改 canon_highlight，并把 canon_locked 第一项升为逐字锁
#   注：两份已有草案分歧（见文件头），请你最终拍板。
#
# ② 【branched_lowprofile 是否成立】
#   AI草案：成立
#   理由：暗杀主线贯穿第一部（狙击→车祸→宫田→鸣人指控→天台），
#         "少暴露一次"是有意义的δ种子——哪怕微降，P1-D天台遇袭时玩家也能感受到
#         "我之前帮了一把"的因果回响（这正是δ账本的精髓）
#   反面意见（不成立的理由）：
#         本节点是暗杀主线"结构性开局"——世界政府已确认卡卡西=必须清除目标（E014-01源老大接报告），
#         玩家的临场行动改变不了这条追杀线的烈度；
#         → 若认为"少暴露一次"无意义，删 branched_lowprofile，
#           只保留 converged，本节点退化为"无分叉、纯临场温度"节点
#
# ③ 【combine_threshold】
#   AI草案：2（make_cover + spot_shooter 两手同时达成）
#   理由：符合f(Δ)设计——单点干涉被收敛，组合才破局；难度适中
#   若②裁决"分叉成立"且你觉得门槛太高：改1（任一手段即给分叉，更易达成）
#   若②裁决"分叉不成立"：本槽作废
